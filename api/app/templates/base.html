<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DLP Secure Transfer{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
<header class="top">
  <a class="brand" href="/">&#128274; DLP Secure Transfer</a>
  {% if user %}
  <nav>
    {% if user.role in ("sender", "admin") %}<a href="/send">Send</a><a href="/transfers">My transfers</a>{% endif %}
    {% if user.role in ("approver", "admin") %}<a href="/approvals">Approvals</a>{% endif %}
    {% if user.role == "admin" %}<a href="/admin">Admin</a>{% endif %}
  </nav>
  <form method="post" action="/logout" class="who"><span>{{ user.email }} <em class="role">{{ user.role }}</em></span><button class="link">Sign out</button></form>
  {% endif %}
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
