apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dlp.fullname" . }}-worker
  labels: {{- include "dlp.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "dlp.selector" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "dlp.selector" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "dlp.fullname" . }}-worker
      {{- include "dlp.podSecurity" . | nindent 6 }}
      containers:
        - name: worker
          image: "{{ .Values.image.worker.repository }}:{{ .Values.image.worker.tag }}"
          imagePullPolicy: {{ .Values.image.worker.pullPolicy }}
          {{- include "dlp.containerSecurity" . | nindent 10 }}
          ports: [{name: metrics, containerPort: 9090}]
          env:
            - {name: AWS_REGION, value: {{ .Values.config.region | quote }}}
            - {name: S3_BUCKET, value: {{ .Values.config.bucket | quote }}}
            - {name: SQS_QUEUE_NAME, value: {{ .Values.config.queueName | quote }}}
            - {name: API_INTERNAL_URL, value: "http://{{ include "dlp.fullname" . }}-api"}
            - {name: SCAN_DELAY_SECONDS, value: {{ .Values.config.scanDelaySeconds | quote }}}
            - name: SCAN_HMAC_SECRET
              valueFrom: {secretKeyRef: {name: {{ include "dlp.secretName" . }}, key: SCAN_HMAC_SECRET}}
            {{- if .Values.config.awsEndpointUrl }}
            - {name: AWS_ENDPOINT_URL, value: {{ .Values.config.awsEndpointUrl | quote }}}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: {{ include "dlp.secretName" . }}, key: AWS_ACCESS_KEY_ID}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: {{ include "dlp.secretName" . }}, key: AWS_SECRET_ACCESS_KEY}}
            {{- end }}
            {{- if .Values.config.otlpEndpoint }}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ .Values.config.otlpEndpoint | quote }}}
            {{- end }}
          readinessProbe:
            httpGet: {path: /healthz, port: metrics}
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            initialDelaySeconds: 10
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dlp.fullname" . }}-worker
  labels: {{- include "dlp.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  selector:
    {{- include "dlp.selector" . | nindent 4 }}
    app.kubernetes.io/component: worker
  ports:
    - {name: metrics, port: 9090, targetPort: metrics}
{{- if .Values.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "dlp.fullname" . }}
  labels: {{- include "dlp.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  endpoints:
    - {port: http, path: /metrics}
    - {port: metrics, path: /metrics}
{{- end }}
