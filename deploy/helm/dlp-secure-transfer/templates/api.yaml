apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dlp.fullname" . }}-api
  labels: {{- include "dlp.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "dlp.selector" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "dlp.selector" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "dlp.fullname" . }}-api
      {{- include "dlp.podSecurity" . | nindent 6 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "dlp.selector" . | nindent 14 }}
              app.kubernetes.io/component: api
      containers:
        - name: api
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          {{- include "dlp.containerSecurity" . | nindent 10 }}
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - secretRef: {name: {{ include "dlp.secretName" . }}}
          env:
            - {name: AWS_REGION, value: {{ .Values.config.region | quote }}}
            - {name: S3_BUCKET, value: {{ .Values.config.bucket | quote }}}
            - {name: SQS_QUEUE_NAME, value: {{ .Values.config.queueName | quote }}}
            - {name: BOOTSTRAP_AWS, value: {{ .Values.config.bootstrapAws | quote }}}
            - {name: SEED_ON_START, value: {{ .Values.config.seedOnStart | quote }}}
            - {name: COOKIE_SECURE, value: {{ .Values.config.cookieSecure | quote }}}
            {{- if .Values.config.awsEndpointUrl }}
            - {name: AWS_ENDPOINT_URL, value: {{ .Values.config.awsEndpointUrl | quote }}}
            {{- end }}
            {{- if .Values.config.s3PublicEndpointUrl }}
            - {name: S3_PUBLIC_ENDPOINT_URL, value: {{ .Values.config.s3PublicEndpointUrl | quote }}}
            {{- end }}
            {{- if .Values.config.otlpEndpoint }}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ .Values.config.otlpEndpoint | quote }}}
            {{- end }}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dlp.fullname" . }}-api
  labels: {{- include "dlp.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.api.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "dlp.selector" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
      {{- if and (eq .Values.api.service.type "NodePort") .Values.api.service.nodePort }}
      nodePort: {{ .Values.api.service.nodePort }}
      {{- end }}
