{{- if .Values.localDeps.enabled }}
# kind only: in-cluster PostgreSQL and moto (S3 + SQS emulator). In AWS these are RDS, S3 and SQS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dlp.fullname" . }}-postgres
  labels: {{- include "dlp.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:17.6-alpine
          env:
            - {name: POSTGRES_USER, value: {{ .Values.db.ownerUser | quote }}}
            - {name: POSTGRES_DB, value: {{ .Values.db.name | quote }}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "dlp.secretName" . }}, key: POSTGRES_PASSWORD}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", {{ .Values.db.ownerUser | quote }}]}
            periodSeconds: 3
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dlp.fullname" . }}-postgres
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: postgres}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dlp.fullname" . }}-moto
  labels: {{- include "dlp.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: moto}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: moto}
    spec:
      containers:
        - name: moto
          image: motoserver/moto:5.2.5
          env: [{name: MOTO_PORT, value: "5000"}]
          ports: [{containerPort: 5000}]
          readinessProbe:
            httpGet: {path: /moto-api/, port: 5000}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dlp.fullname" . }}-moto
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  {{- if .Values.localDeps.motoNodePort }}
  type: NodePort
  {{- end }}
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: moto}
  ports:
    - port: 5000
      {{- if .Values.localDeps.motoNodePort }}
      nodePort: {{ .Values.localDeps.motoNodePort }}
      {{- end }}
{{- end }}
