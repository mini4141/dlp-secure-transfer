{{- if .Values.serviceAccount.create }}
{{- range $name := list "api" "worker" }}
---
# EKS Pod Identity associates an IAM role with this ServiceAccount (see infra/).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dlp.fullname" $ }}-{{ $name }}
  labels: {{- include "dlp.labels" $ | nindent 4 }}
{{- end }}
{{- end }}
