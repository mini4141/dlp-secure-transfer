apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dlp.secretName" . }}
  labels: {{- include "dlp.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://{{ .Values.db.appUser }}:{{ .Values.secrets.dbAppPassword }}@{{ .Values.db.host }}:{{ .Values.db.port }}/{{ .Values.db.name }}{{ include "dlp.sslQuery" . }}
  MIGRATION_DATABASE_URL: postgresql+asyncpg://{{ .Values.db.ownerUser }}:{{ .Values.secrets.dbOwnerPassword }}@{{ .Values.db.host }}:{{ .Values.db.port }}/{{ .Values.db.name }}{{ include "dlp.sslQuery" . }}
  APP_DB_PASSWORD: {{ .Values.secrets.dbAppPassword | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.dbOwnerPassword | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  SCAN_HMAC_SECRET: {{ .Values.secrets.scanHmacSecret | quote }}
  SEED_PASSWORD: {{ .Values.secrets.seedPassword | quote }}
  {{- if .Values.secrets.awsAccessKeyId }}
  AWS_ACCESS_KEY_ID: {{ .Values.secrets.awsAccessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.secrets.awsSecretAccessKey | quote }}
  {{- end }}
