name: dlp
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: dlp
      POSTGRES_PASSWORD: dlp
      POSTGRES_DB: dlp
    ports: ["15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dlp -d dlp"]
      interval: 3s
      timeout: 3s
      retries: 20

  moto:
    image: motoserver/moto:5.2.5
    environment:
      MOTO_PORT: "5000"
    ports: ["15000:5000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:5000/moto-api/')\""]
      interval: 3s
      timeout: 3s
      retries: 20

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["26686:16686"]

  migrate:
    build: ../api
    image: dlp-api:dev
    command: ["alembic", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+asyncpg://dlp:dlp@postgres:5432/dlp
      APP_DB_PASSWORD: dlp_app
    depends_on:
      postgres: {condition: service_healthy}

  api:
    image: dlp-api:dev
    environment: &api-env
      DATABASE_URL: postgresql+asyncpg://dlp_app:dlp_app@postgres:5432/dlp
      JWT_SECRET: dev-only-jwt-secret-change-me-0123456789
      SCAN_HMAC_SECRET: dev-only-hmac-secret-change-me
      AWS_REGION: ap-southeast-2
      AWS_ENDPOINT_URL: http://moto:5000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:15000
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      S3_BUCKET: dlp-transfers
      SQS_QUEUE_NAME: dlp-scan
      BOOTSTRAP_AWS: "true"
      SEED_ON_START: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports: ["18000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      moto: {condition: service_healthy}
      jaeger: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 30

  worker:
    build: ../worker
    image: dlp-worker:dev
    environment:
      AWS_REGION: ap-southeast-2
      AWS_ENDPOINT_URL: http://moto:5000
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      S3_BUCKET: dlp-transfers
      SQS_QUEUE_NAME: dlp-scan
      API_INTERNAL_URL: http://api:8000
      SCAN_HMAC_SECRET: dev-only-hmac-secret-change-me
      SCAN_DELAY_SECONDS: ${SCAN_DELAY_SECONDS:-2}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports: ["19090:9090"]
    depends_on:
      api: {condition: service_healthy}
